<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthRecorder - 隐秘录音器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
            font-weight: 300;
        }
        
        .subtitle {
            font-size: 20px;
            opacity: 0.9;
            margin-bottom: 40px;
        }
        
        .download-btn {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .features {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            margin-top: -40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        
        .features h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 50px;
            color: #333;
        }
        
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
        }
        
        .feature {
            text-align: center;
            padding: 30px;
            border-radius: 15px;
            background: #f8f9fa;
            transition: transform 0.3s;
        }
        
        .feature:hover {
            transform: translateY(-5px);
        }
        
        .feature-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .feature h3 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #333;
        }
        
        .feature p {
            color: #666;
            font-size: 16px;
        }
        
        .screenshots {
            margin-top: 80px;
            text-align: center;
        }
        
        .screenshots h2 {
            font-size: 32px;
            margin-bottom: 40px;
            color: white;
        }
        
        .screenshot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        
        .screenshot {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        
        .screenshot:hover {
            transform: scale(1.05);
        }
        
        .screenshot img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .placeholder-img {
            width: 100%;
            height: 500px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }
        
        footer {
            text-align: center;
            padding: 60px 20px;
            color: white;
            margin-top: 80px;
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
        }
        
        .footer-links a {
            color: white;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .footer-links a:hover {
            opacity: 1;
        }
        
        .copyright {
            margin-top: 40px;
            opacity: 0.6;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
            }
            
            .subtitle {
                font-size: 18px;
            }
            
            .features {
                padding: 40px 20px;
            }
            
            .feature-grid {
                grid-template-columns: 1fr;
            }
            
            .footer-links {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🎤</div>
            <h1>StealthRecorder</h1>
            <p class="subtitle">隐秘录音器 - 您的智能录音助手</p>
            <a href="#download" class="download-btn">立即下载</a>
        </header>
        
        <section class="features">
            <h2>核心功能</h2>
            <div class="feature-grid">
                <div class="feature">
                    <div class="feature-icon">🔒</div>
                    <h3>后台录音</h3>
                    <p>一键开始录音，应用自动最小化，不打扰您的工作和会议</p>
                </div>
                
                <div class="feature">
                    <div class="feature-icon">📱</div>
                    <h3>折叠屏优化</h3>
                    <p>完美支持折叠屏设备，状态恢复无压力</p>
                </div>
                
                <div class="feature">
                    <div class="feature-icon">💾</div>
                    <h3>本地存储</h3>
                    <p>所有录音文件本地保存，保护您的隐私安全</p>
                </div>
                
                <div class="feature">
                    <div class="feature-icon">⚡</div>
                    <h3>低功耗设计</h3>
                    <p>优化电池使用，长时间录音不耗电</p>
                </div>
            </div>
        </section>
        
        <section class="screenshots">
            <h2>应用截图</h2>
            <div class="screenshot-grid">
                <div class="screenshot">
                    <div class="placeholder-img">主界面</div>
                </div>
                <div class="screenshot">
                    <div class="placeholder-img">录音中</div>
                </div>
                <div class="screenshot">
                    <div class="placeholder-img">文件管理</div>
                </div>
                <div class="screenshot">
                    <div class="placeholder-img">设置界面</div>
                </div>
            </div>
        </section>
        
        <footer>
            <h2 id="download">下载安装</h2>
            <p>目前可通过以下方式获取应用：</p>
            <div class="footer-links">
                <a href="https://github.com/liusamye/stealthrecorder/releases">GitHub Releases</a>
                <a href="privacy.html">隐私政策</a>
                <a href="mailto:liusamye@163.com">联系支持</a>
                <a href="donate.html">支持开发者</a>
            </div>
            <p class="copyright">© 2026 StealthRecorder. 保留所有权利。</p>
        </footer>
    </div>
</body>
</html>
