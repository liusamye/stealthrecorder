name: Android Release Build

on:
  push:
    tags:
      - 'v*'  # 当推送v开头的标签时触发
  workflow_dispatch:  # 允许手动触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 33
        build-tools-version: "33.0.0"
    
    - name: Accept Android SDK licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Create signing certificate (for testing)
      if: env.KEYSTORE_BASE64 == ''
      run: |
        echo "创建测试签名证书..."
        mkdir -p app/certs
        keytool -genkeypair -v \
          -keystore app/certs/stealthrecorder.jks \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -alias key0 \
          -storepass 123456 \
          -keypass 123456 \
          -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=CN"
        echo "测试证书创建完成"
    
    - name: Setup signing certificate from secrets
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "从GitHub Secrets加载签名证书..."
        mkdir -p app/certs
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/certs/stealthrecorder.jks
        
        # 创建gradle.properties文件
        cat > gradle.properties << EOF
        # 签名配置
        STORE_FILE=app/certs/stealthrecorder.jks
        STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS=${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
        EOF
        echo "证书配置完成"
    
    - name: Build Release APK
      run: |
        echo "构建发布版APK..."
        ./gradlew assembleRelease
        
        # 验证APK
        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ 发布版APK构建成功"
            ls -lh app/build/outputs/apk/release/app-release.apk
        else
            echo "❌ 发布版APK构建失败"
            exit 1
        fi
    
    - name: Generate SHA256 checksum
      run: |
        echo "生成APK校验和..."
        cd app/build/outputs/apk/release
        sha256sum app-release.apk > app-release.apk.sha256
        echo "校验和:"
        cat app-release.apk.sha256
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/apk/release/app-release.apk.sha256
        generate_release_notes: true
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: stealthrecorder-release
        path: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/apk/release/app-release.apk.sha256
        retention-days: 30