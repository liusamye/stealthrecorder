apply plugin: 'com.android.application'

android {
    namespace 'com.example.stealthrecorder'
    compileSdk 33  // 更新到更现代的版本

    defaultConfig {
        applicationId "com.example.stealthrecorder"
        minSdk 21  // 提高最低版本以获得更好兼容性
        targetSdk 33
        versionCode 3  // 版本号递增
        versionName "1.2"  // 新版本
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 零依赖！纯原生Android
}
