apply plugin: 'com.android.application'

android {
    namespace 'com.example.stealthrecorder'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.stealthrecorder"
        minSdk 21
        targetSdk 33
        versionCode 4  // 版本号递增
        versionName "1.3"  // 新版本
    }

    // 签名配置
    signingConfigs {
        release {
            storeFile file("certs/stealthrecorder.jks")
            storePassword "123456"  // 请修改为您的密码
            keyAlias "key0"
            keyPassword "123456"    // 请修改为您的密码
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "DEBUG", "true"
            minifyEnabled false
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            buildConfigField "boolean", "DEBUG", "false"
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            debuggable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 添加AndroidX支持库
    implementation 'androidx.core:core:1.9.0'
}
