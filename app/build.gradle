plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.stealthrecorder'
    compileSdk 30

    defaultConfig {
        applicationId "com.example.stealthrecorder"
        minSdk 16
        targetSdk 30
        versionCode 2  # 版本号递增
        versionName "1.1"  # 新版本
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 零依赖！纯原生Android
}
