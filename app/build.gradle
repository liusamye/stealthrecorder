plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.stealthrecorder'
    compileSdk 30  // 使用更旧的SDK 30，最稳定

    defaultConfig {
        applicationId "com.example.stealthrecorder"
        minSdk 16  // 最低支持Android 4.1，最大化兼容性
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 零依赖！纯原生Android
    // 不需要任何AndroidX或第三方库
}