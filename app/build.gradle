plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.stealthrecorder'
    compileSdk 33
    
    defaultConfig {
        applicationId "com.example.stealthrecorder"
        minSdk 16
        targetSdk 33
        versionCode 2
        versionName "1.1"
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 零依赖！纯原生Android
}
