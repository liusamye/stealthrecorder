// Top-level build file where you can add configuration options common to all sub-projects/modules.
// 使用与Gradle 8.5兼容的Android Gradle Plugin版本
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Android Gradle Plugin 7.4.2 与 Gradle 8.5 兼容
        // 参考：https://developer.android.com/build/releases/gradle-plugin#compatibility
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}